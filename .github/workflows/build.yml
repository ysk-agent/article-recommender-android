name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Emulator test scope (marker = read the [test: ...] marker from the HEAD commit message)"
        type: choice
        options: [marker, all, feed, interact, none]
        default: marker
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The committing agent picks the emulator test scope per change
      # with a [test: all|none] marker in the commit message; no marker
      # means all. The LAST marker in the message wins.
      - name: Determine test scope
        id: scope
        run: |
          SCOPE="${{ inputs.test_scope }}"
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "marker" ]; then
            MSG=$(git log -1 --format=%B)
            M=$(echo "$MSG" | grep -oE '\[test: (all|feed|interact|none)\]' | tail -1 | sed 's/\[test: //; s/\]//')
            SCOPE="${M:-all}"
          fi
          echo "test scope: $SCOPE"
          if [ "$SCOPE" = "none" ]; then echo "run_emulator=false" >> "$GITHUB_OUTPUT";
          else echo "run_emulator=true" >> "$GITHUB_OUTPUT"; echo "sections=$SCOPE" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform 35 (only if missing)
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "already present; skipping sdkmanager install."
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        env:
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK to fixed name
        run: cp app/build/outputs/apk/debug/app-debug.apk discover.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discover-apk
          path: discover.apk
          if-no-files-found: error
      - name: Enable KVM
        if: steps.scope.outputs.run_emulator == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        if: steps.scope.outputs.run_emulator == 'true'
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-pixel6-v1
      - name: Create AVD and generate snapshot for caching
        if: steps.scope.outputs.run_emulator == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."
      - name: Launch app on emulator
        if: steps.scope.outputs.run_emulator == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: TEST_SECTIONS=${{ steps.scope.outputs.sections }} bash ci/emulator-launch-test.sh
      - name: Upload launch diagnostics
        if: always() && steps.scope.outputs.run_emulator == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: launch-diagnostics
          path: |
            logcat.txt
            window_dump.xml
            screenshot-main.png
            screenshot-reader.png
            screenshot-sources.png
            screenshot-history.png
            screenshot-settings.png
          if-no-files-found: warn
